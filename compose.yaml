services:
  freecell:
    build: .
    image: freecell-pwa:latest
    container_name: freecell
    restart: unless-stopped
    ports:
      - "8090:80"   # optional: LAN access; the tunnel talks to the container directly
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - freecell-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: freecell-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      freecell:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - freecell-net

networks:
  freecell-net:
    driver: bridge
